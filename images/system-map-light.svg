<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">See it as one system → sanlee.me</title>
  <desc id="mapDesc">Six repository names — defense-news-classifier, claude-ops, kb-agent on the left; faithfulness-judge, architecture, learning-notes on the right — connect by traces into a single node, which points down to a sanlee.me button under the heading "See it as one system." A small circuit trace rises through net ops, software, and product in the top right corner.</desc>
  <defs>
    <radialGradient id="mblob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mframe">
      <rect x="0" y="0" width="1280" height="660" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#mframe)">
    <rect x="0" y="0" width="1280" height="660" fill="#ffffff"/>
    <ellipse cx="1060" cy="120" rx="380" ry="380" fill="url(#mblob)"/>
    <ellipse cx="200" cy="560" rx="340" ry="340" fill="url(#mblob)"/>
  </g>
  <!-- the arc, in the corner: net ops -> software -> product -->
  <g clip-path="url(#mframe)">
    <path d="M 920 150 H 1000 L 1025 130 H 1105 L 1130 110 H 1195" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <rect x="914" y="144" width="12" height="12" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
    <circle cx="1065" cy="130" r="5.5" fill="none" stroke="#2563eb" stroke-width="2"/>
    <rect x="1195" y="104" width="12" height="12" rx="2" transform="rotate(45 1201 110)" fill="#2563eb"/>
    <g font-family="'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="1.8" fill="#59636e">
      <text x="920" y="174" text-anchor="middle">NET&#160;OPS</text>
      <text x="1065" y="154" text-anchor="middle">SOFTWARE</text>
      <text x="1201" y="134" text-anchor="middle">PRODUCT</text>
    </g>
  </g>
  <!-- heading -->
  <g font-family="'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="90" y="98" font-size="13" font-weight="500" letter-spacing="2.6" fill="#59636e">THE REPOS ARE THE PARTS</text>
    <text x="88" y="158" font-size="54" font-weight="600" letter-spacing="-1.1" fill="#1f2328">See it as one system</text>
    <text x="90" y="198" font-size="19" fill="#59636e">the decisions behind each call, and how it all fits together</text>
  </g>
  <!-- converging traces, both sides into the junction -->
  <g fill="none" stroke="#d1d9e0" stroke-width="2">
    <path d="M 492 300 C 552 300 580 388 634 390"/>
    <path d="M 492 380 C 550 380 578 389 634 390"/>
    <path d="M 492 460 C 552 460 580 392 634 390"/>
    <path d="M 788 300 C 728 300 700 388 646 390"/>
    <path d="M 788 380 C 730 380 702 389 646 390"/>
    <path d="M 788 460 C 728 460 700 392 646 390"/>
  </g>
  <!-- repo labels -->
  <g font-family="'Cascadia Code','SF Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="18" fill="#59636e">
    <g text-anchor="end">
      <text x="474" y="306">defense-news-classifier</text>
      <text x="474" y="386">claude-ops</text>
      <text x="474" y="466">kb-agent</text>
    </g>
    <g text-anchor="start">
      <text x="806" y="306">faithfulness-judge</text>
      <text x="806" y="386">architecture</text>
      <text x="806" y="466">learning-notes</text>
    </g>
  </g>
  <g fill="#2563eb">
    <circle cx="492" cy="300" r="3.5"/>
    <circle cx="492" cy="380" r="3.5"/>
    <circle cx="492" cy="460" r="3.5"/>
    <circle cx="788" cy="300" r="3.5"/>
    <circle cx="788" cy="380" r="3.5"/>
    <circle cx="788" cy="460" r="3.5"/>
  </g>
  <!-- junction, stem, CTA -->
  <circle cx="640" cy="390" r="9" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="640" cy="390" r="3" fill="#2563eb"/>
  <path d="M 640 402 V 518" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="633.5,518 646.5,518 640,530" fill="#2563eb"/>
  <rect x="510" y="540" width="260" height="60" rx="30" fill="#2563eb"/>
  <text x="640" y="578" font-family="'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#ffffff">sanlee.me &#8594;</text>
  <rect x="1" y="1" width="1278" height="658" rx="13" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
</svg>
